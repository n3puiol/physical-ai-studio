[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physicalai-starvla-policy-plugin"
version = "0.1.0"
description = "Isolated StarVLA training and Runtime inference for Physical AI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
    "physicalai>=0.4.1.dev0,<0.5",
    "numpy>=1.26",
    "uv>=0.13.4,<0.14",
]

[project.optional-dependencies]
train = ["physicalai-train>=0.3.0"]
# Serve packages to StarVLA's own benchmark clients (python -m physicalai_starvla_policy_plugin.serve).
serve = ["websockets>=13", "msgpack>=1.0"]
tests = ["pytest>=9.0.3"]

[project.entry-points."physicalai.engines"]
starvla = "physicalai_starvla_policy_plugin.engine:StarVLAEngine"

[project.entry-points."physicalai.inference.adapters"]
starvla = "physicalai_starvla_policy_plugin.inference:register"

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_starvla_policy_plugin"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/configs/**", "/src/physicalai_starvla_policy_plugin/**", "/tests/**"]

[tool.uv.sources]
physicalai = { git = "https://github.com/n3puiol/physicalai.git", rev = "51c3062820b8a23452e0073f7c7b3fb9fadcba61" }
# Keep the optional train extra on this checkout's Runtime source.
physicalai-train = { path = "../../../library", editable = true }

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["undocumented-public-function", "assert", "magic-value-comparison", "import-private-name", "private-member-access"]
"src/physicalai_starvla_policy_plugin/_worker/*.py" = ["implicit-namespace-package", "print", "import-outside-top-level"]
# Upstream exposes no public callbacks; hooks wrap its pinned trainer methods.
"src/physicalai_starvla_policy_plugin/_worker/starvla_train_worker.py" = ["private-member-access"]
# Converts untyped upstream torch/StarVLA objects and reads their private normalizer and wrapper state.
"src/physicalai_starvla_policy_plugin/_worker/starvla_openvino_export.py" = ["any-type", "private-member-access", "import-private-name"]
