[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physicalai-starvla-policy-plugin"
version = "0.1.0"
description = "Isolated StarVLA training and Runtime inference for Physical AI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["physicalai~=0.3.0", "numpy>=1.26", "uv>=0.10,<0.11"]

[project.optional-dependencies]
train = ["physicalai-train>=0.3.0"]
tests = ["pytest>=9.0.3"]

[project.entry-points."physicalai.engines"]
starvla = "physicalai_starvla_policy_plugin.engine:StarVLAEngine"

[project.entry-points."physicalai.inference.adapters"]
starvla = "physicalai_starvla_policy_plugin.inference:register"

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_starvla_policy_plugin"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/configs/**", "/src/physicalai_starvla_policy_plugin/**", "/tests/**"]

[tool.uv.sources]
physicalai = { git = "https://github.com/samet-akcay/physicalai", branch = "feat/physicalai-isolate" }
physicalai-train = { path = "../../../library", editable = true }

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["undocumented-public-function", "assert", "magic-value-comparison", "import-private-name", "private-member-access"]
"src/physicalai_starvla_policy_plugin/_worker/*.py" = ["implicit-namespace-package", "print", "import-outside-top-level"]
# Upstream exposes no public callbacks; hooks wrap its pinned trainer methods.
"src/physicalai_starvla_policy_plugin/_worker/starvla_train_worker.py" = ["private-member-access"]
