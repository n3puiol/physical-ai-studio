# QwenPI single-GPU smoke run. Supply local backbone and dataset root as overrides.
# QwenPI's action head is a DiT with one block per VLM layer at the VLM's width: about 1.7B
# parameters with Qwen3-VL-2B and 3.4B with Qwen3-VL-4B. Training all of it needs more than 24 GB,
# so this config also freezes the DiT blocks and trains the head's encoders, decoders and
# embeddings. On a larger GPU, drop action_model.model.transformer_blocks from freeze_modules.
run_id: starvla-qwenpi
run_root_dir: ./runs
seed: 42
wandb_entity: null
wandb_project: physicalai-starvla
is_debug: false
version_id: "0.21"
framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./Qwen3-VL-2B-Instruct
    attn_implementation: sdpa
  action_model:
    action_dim: 7
    state_dim: 8
    action_horizon: 8
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./datasets
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 1
    num_workers: 0 # Avoid forking video decoders after model initialization in the smoke run.
    load_all_data_for_training: true
    video_backend: torchvision_av
trainer:
  max_train_steps: 20
  num_warmup_steps: 2
  save_interval: 20
  eval_interval: 100
  save_format: safetensors
  learning_rate:
    base: 2.5e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: qwen_vl_interface,action_model.model.transformer_blocks
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
