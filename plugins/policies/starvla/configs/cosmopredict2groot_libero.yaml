# CosmoPredict2GR00T: StarVLA's world-model VLA, a GR00T-style flow-matching action head on the
# Cosmos-Predict2-2B world model (nvidia/Cosmos-Predict2-2B-Video2World, a diffusers folder:
# T5 text encoder, Wan VAE and video DiT). A 20-step LIBERO smoke run for one 24 GB GPU: the world
# model (about 14 GB in bf16) is frozen and only the action head trains; StarVLA's own LIBERO recipe
# trains everything on 8 GPUs with DeepSpeed. Cosmos-Predict2 is gated: accept NVIDIA's Open Model
# License on Hugging Face before downloading it. Supply the local world model and dataset root as
# overrides; CosmoPredict2OFT takes the same config with framework.name changed, and CosmoPredict2PI
# has its own (cosmopredict2pi_libero.yaml).
run_id: starvla-cosmos
run_root_dir: ./runs
seed: 42
wandb_entity: null
wandb_project: physicalai-starvla
is_debug: false
version_id: "0.21"
framework:
  name: CosmoPredict2GR00T
  world_model:
    base_wm: ./Cosmos-Predict2-2B-Video2World
    extract_layers: [-1]
  action_model:
    action_dim: 7
    state_dim: 8
    action_horizon: 8
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./datasets
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 1
    num_workers: 0 # Avoid forking video decoders after model initialization in the smoke run.
    load_all_data_for_training: true
    video_backend: torchvision_av
trainer:
  max_train_steps: 20
  num_warmup_steps: 2
  save_interval: 20
  eval_interval: 100
  save_format: safetensors
  learning_rate:
    base: 2.5e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: backbone
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
