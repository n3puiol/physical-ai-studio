# QwenFast: a 20-step LIBERO smoke run. QwenFast encodes action chunks with the FAST tokenizer
# (physical-intelligence/fast at ec4d7aa7) and trains the VLM to emit them as <robot_action_N>
# tokens, so it needs StarVLA's Qwen3-VL-4B-Instruct-Action backbone, which adds those tokens.
# Because the actions come out of the language model, part of it must train: to fit a 24 GB GPU this
# config trains only the last two of its 36 layers; upstream's recipes train the whole VLM.
run_id: starvla-qwenfast
run_root_dir: ./runs
seed: 42
wandb_entity: null
wandb_project: physicalai-starvla
is_debug: false
version_id: "0.21"
framework:
  name: QwenFast
  qwenvl:
    base_vlm: ./Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
    vl_hidden_dim: 2560
  action_model:
    action_dim: 7
    action_horizon: 8
    # A plugin key: StarVLA builds the FAST tokenizer from a fixed relative path instead.
    fast_tokenizer_path: /absolute/path/to/fast
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./datasets
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 1
    num_workers: 0 # Avoid forking video decoders after model initialization in the smoke run.
    load_all_data_for_training: true
    video_backend: torchvision_av
trainer:
  max_train_steps: 20
  num_warmup_steps: 2
  save_interval: 20
  eval_interval: 100
  save_format: safetensors
  learning_rate:
    base: 2.5e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: >-
    qwen_vl_interface.model.model.visual,
    qwen_vl_interface.model.model.language_model.embed_tokens,
    qwen_vl_interface.model.model.language_model.layers.0,
    qwen_vl_interface.model.model.language_model.layers.1,
    qwen_vl_interface.model.model.language_model.layers.2,
    qwen_vl_interface.model.model.language_model.layers.3,
    qwen_vl_interface.model.model.language_model.layers.4,
    qwen_vl_interface.model.model.language_model.layers.5,
    qwen_vl_interface.model.model.language_model.layers.6,
    qwen_vl_interface.model.model.language_model.layers.7,
    qwen_vl_interface.model.model.language_model.layers.8,
    qwen_vl_interface.model.model.language_model.layers.9,
    qwen_vl_interface.model.model.language_model.layers.10,
    qwen_vl_interface.model.model.language_model.layers.11,
    qwen_vl_interface.model.model.language_model.layers.12,
    qwen_vl_interface.model.model.language_model.layers.13,
    qwen_vl_interface.model.model.language_model.layers.14,
    qwen_vl_interface.model.model.language_model.layers.15,
    qwen_vl_interface.model.model.language_model.layers.16,
    qwen_vl_interface.model.model.language_model.layers.17,
    qwen_vl_interface.model.model.language_model.layers.18,
    qwen_vl_interface.model.model.language_model.layers.19,
    qwen_vl_interface.model.model.language_model.layers.20,
    qwen_vl_interface.model.model.language_model.layers.21,
    qwen_vl_interface.model.model.language_model.layers.22,
    qwen_vl_interface.model.model.language_model.layers.23,
    qwen_vl_interface.model.model.language_model.layers.24,
    qwen_vl_interface.model.model.language_model.layers.25,
    qwen_vl_interface.model.model.language_model.layers.26,
    qwen_vl_interface.model.model.language_model.layers.27,
    qwen_vl_interface.model.model.language_model.layers.28,
    qwen_vl_interface.model.model.language_model.layers.29,
    qwen_vl_interface.model.model.language_model.layers.30,
    qwen_vl_interface.model.model.language_model.layers.31,
    qwen_vl_interface.model.model.language_model.layers.32,
    qwen_vl_interface.model.model.language_model.layers.33
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
